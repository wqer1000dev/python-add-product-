<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürünler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header class="topbar">
      <div class="profile">
        <div class="avatar"><img src="assets/avatar.svg" alt="Profil resmi"></div>
        <div>
          <div class="username">Nazgul</div>
          <span class="role user" lang="en">User</span>
        </div>
      </div>
    </header>

    <main class="layout">

      <section class="panel" aria-label="Oyunlar">
        <div class="title">Oyunlar</div>
        <div id="product-list"></div>
      </section>

      <aside class="panel" aria-label="Güncellemeler">
        <div class="title">Güncellemeler</div>

        <article class="update">
          <span class="author">Ömer</span>
          <span class="role admin" lang="en">Admin</span>
          <p>Rainbow Six Siege v2.4.1 yayında.</p>
          <time datetime="2026-10-20">20 Ekim 2026</time>
        </article>

        <article class="update">
          <span class="author">Mehmet</span>
          <span class="role user" lang="en">User</span>
          <p>FiveM sorunsuz çalışıyor, teşekkürler!</p>
          <time datetime="2026-10-18">18 Ekim 2026</time>
        </article>

        <article class="update">
          <span class="author">Ömer</span>
          <span class="role admin" lang="en">Admin</span>
          <p>Squad v3.0.2 güncellemesi yayınlandı.</p>
          <time datetime="2026-10-15">15 Ekim 2026</time>
        </article>
      </aside>

    </main>
  </div>

  <script src="products.js"></script>
  <script>
    document.getElementById('product-list').innerHTML = PRODUCTS.map(p => `
      <div class="product">
        ${logoHTML(p)}
        <span class="name">${p.name}</span>
        <span class="version">${p.version}</span>
        <a class="btn" href="product.html?id=${p.id}">Purchase</a>
      </div>`).join('');
  </script>
</body>
</html>
